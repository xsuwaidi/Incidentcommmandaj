<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<script>window.IC_REALMAP=true</script>
<script src="firebase-config.js"></script>
<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-auth-compat.js"></script>
<script src="vendor/firebase/firebase-firestore-compat.js"></script>
<script src="vendor/firebase/firebase-storage-compat.js"></script>
<script src="backend-firebase.js"></script>
<script type="module" src="backend-ai.js"></script>
</head>
<body>
<title>غرفة قيادة الحادث</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Readex+Pro:wght@500;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: sticky incident strip + role switcher, then one working column per role; panels stack on phones */
:root{
  --bg:#eceff2; --panel:#fbfcfd; --sunk:#e2e7ec; --ink:#16212b; --mute:#5a6775; --line:#cfd7df;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fbe3d6;
  --ok:#157a3c; --warn:#a85a07; --crit:#b42318;
  --ok-soft:#dcf1e3; --warn-soft:#fbecd3; --crit-soft:#fbdedb;
  --ai:#5b3fc4; --ai-soft:#ece7fb;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --panel:#16202a; --sunk:#1d2a36; --ink:#e4ebf1; --mute:#93a2b1; --line:#2a3946;
  --accent:#f0782f; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --ok:#4fc77b; --warn:#f2b441; --crit:#f2766b;
  --ok-soft:#163222; --warn-soft:#3a2c10; --crit-soft:#3d1a17; --ai:#b4a2ff; --ai-soft:#251d44; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e141a; --panel:#16202a; --sunk:#1d2a36; --ink:#e4ebf1; --mute:#93a2b1; --line:#2a3946;
  --accent:#f0782f; --accent-ink:#1a0d04; --accent-soft:#3a2214;
  --ok:#4fc77b; --warn:#f2b441; --crit:#f2766b;
  --ok-soft:#163222; --warn-soft:#3a2c10; --crit-soft:#3d1a17; --ai:#b4a2ff; --ai-soft:#251d44; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:10px}
.strip h1{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700;text-wrap:balance}
.strip .meta{color:var(--mute);font-size:13px}
.clock{margin-inline-start:auto;font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--accent)}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:0 10px}
.roles button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 4px;font-weight:500;font-size:14px}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.roles small{display:block;font-size:11px;opacity:.8;font-weight:400}

main{padding-block:16px 40px;display:grid;gap:16px}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel>h2,.h2{font-family:var(--f-display);font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:700}
.h2 .count{font-family:var(--f-body);font-size:12px;background:var(--sunk);border-radius:99px;padding:1px 8px;color:var(--mute)}
.stack{display:grid;gap:8px}
.muted{color:var(--mute);font-size:13px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--ok);background:var(--ok-soft)} .warn{color:var(--warn);background:var(--warn-soft)} .crit{color:var(--crit);background:var(--crit-soft)}
.neutral{color:var(--mute);background:var(--sunk)}

.letter{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;font-weight:700;background:var(--ink);color:var(--panel)}
.letter.sm{width:30px;height:30px;font-size:16px;border-radius:8px}
.hero{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero h2{font-family:var(--f-display);font-size:19px;margin:0;line-height:1.3}
.hero .sub{color:var(--mute);font-size:13px}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}

.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* request bar */
.reqbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.reqbar button{flex:none;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}
.reqbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.reqbar button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.compose{margin-top:10px;border:1px dashed var(--accent);border-radius:10px;padding:12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.compose b{font-family:var(--f-display)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:var(--sunk);width:30px;height:30px;font-size:17px;line-height:1}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.btn{border:0;border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}

/* rows */
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1 1 140px;min-width:0}
.row .name{font-weight:500}
.role{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--sunk);color:var(--mute)}
.role.r1{background:var(--crit-soft);color:var(--crit)} .role.r2{background:color-mix(in srgb,#2563eb 16%,transparent);color:#3b7be8} .role.r3{background:var(--warn-soft);color:var(--warn)}
select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 6px;font-size:13px;max-width:100%}

.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px;border-radius:10px;background:var(--sunk)}
.req.urgent{box-shadow:inset 3px 0 0 var(--crit)}
.req .what{font-weight:700}
.req .acts{display:flex;gap:6px;grid-column:1/-1;justify-content:flex-end}
.req .when{font-size:12px;color:var(--mute)}

.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.pool div{background:var(--sunk);border-radius:8px;padding:6px 9px}
.pool b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.2}
.pool span{font-size:12px;color:var(--mute)}
.pool .zero b{color:var(--crit)}

.sector{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--panel)}
.sector.st-tough{border-color:var(--warn)} .sector.st-critical{border-color:var(--crit)}
.sector header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sector header .grow{flex:1;min-width:0}
.sector h3{margin:0;font-family:var(--f-display);font-size:15px}
.lbl{font-size:11px;letter-spacing:.02em;color:var(--mute);font-weight:500;margin-bottom:3px}
.resgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.resgrid>div{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--sunk);border-radius:8px;padding:4px 4px 4px 4px;padding-inline-start:9px;font-size:13px}
.riskdots{display:flex;gap:4px}
.riskdots button{width:30px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px}
.riskdots button.on{color:#fff;border-color:transparent}
.rk1{background:#2f8f55!important}.rk2{background:#7a9a2a!important}.rk3{background:#c98a12!important}.rk4{background:#d0581c!important}.rk5{background:#b42318!important}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--sunk);border-radius:6px;padding:2px 8px}
.chip b{font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{font-family:var(--f-display);font-size:26px;display:block;line-height:1.15}
.kpi span{font-size:12px;color:var(--mute)}
.kpi.alert{border-color:var(--crit)} .kpi.alert b{color:var(--crit)}

.map{width:100%;max-width:520px;display:block;margin:0 auto}
.map text{font-family:var(--f-body);fill:var(--ink)}
.map .t-mute{fill:var(--mute)}
.map .bld{fill:var(--sunk);stroke:var(--ink);stroke-width:1.5}
.map .side{cursor:pointer}

.log{list-style:none;margin:0;padding:0;display:grid;gap:0;max-height:340px;overflow-y:auto}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.log li:first-child{border-top:0}
.log time{color:var(--mute);font-variant-numeric:tabular-nums}

.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 6px;background:var(--panel)}
.toggle i{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:right .2s}
.toggle[aria-pressed="true"] i{background:var(--ok)}
.toggle[aria-pressed="true"] i::after{right:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.empty{padding:14px;text-align:center;color:var(--mute);font-size:13px;background:var(--sunk);border-radius:10px}
.example{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 6px}
/* live + interaction */
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:99px;padding:2px 10px;background:var(--sunk);color:var(--mute)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.conn.live{color:var(--ok);background:var(--ok-soft)} .conn.live i{background:var(--ok);animation:pulse 2s infinite}
.peers{display:flex;gap:4px;flex-wrap:wrap}
.peer{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;background:var(--panel)}
.peer.me{border-color:var(--accent);color:var(--accent)}
@keyframes pulse{50%{opacity:.35}}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 1.6s ease-out 2}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;margin-inline-start:4px;vertical-align:middle}
.roles button{position:relative}
.drag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;position:relative}
.drag:active{cursor:grabbing}
.drag::after{content:"⋮⋮";position:absolute;top:4px;left:7px;font-size:11px;color:var(--mute);letter-spacing:-2px}
.dragghost{position:fixed;z-index:20;pointer-events:none;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;transform:translate(50%,-130%);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.droppable{outline:2px dashed var(--accent);outline-offset:3px}
.dropover{background:var(--accent-soft)!important;outline-style:solid}
.map .side.dropover rect{fill-opacity:.9}
.map .side.droppable rect{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.hint{font-size:12px;color:var(--mute);margin:4px 0 0}
details.crew summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:500;list-style:none}
details.crew summary::-webkit-details-marker{display:none}
details.crew summary::before{content:"◂ ";display:inline-block;transition:transform .2s}
details.crew[open] summary::before{transform:rotate(-90deg)}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px;margin-top:8px}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.start{display:grid;gap:12px;justify-items:start;padding:24px}
.start h2{font-family:var(--f-display);margin:0;font-size:20px}
.crow{cursor:pointer}
.media-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.capture{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 16px;font-weight:500;font-size:14px;cursor:pointer;overflow:hidden}
.capture svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.capture input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.capture:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.capture:hover{border-color:var(--accent);color:var(--accent)}
.note{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-width:100%;width:100%;cursor:pointer;display:block;font:inherit}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:12px;display:flex;gap:6px;align-items:center;justify-content:flex-start}
.tile .cap b{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 6px}
.tile .play{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff;font-size:12px}
.tile.new{box-shadow:0 0 0 3px var(--accent)}
.tile .ph{display:grid;place-items:center;height:100%;color:var(--mute);font-size:12px;padding:8px;text-align:center}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(5,9,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img,.lightbox video{max-width:100%;max-height:74vh;border-radius:10px;background:#000}
.lightbox{overflow-y:auto;justify-content:flex-start}
.lightbox.has-ai img,.lightbox.has-ai video{max-height:52vh}
/* AI analysis */
.aicard{display:grid;gap:7px;background:var(--panel);color:var(--ink);border:1px solid var(--ai);border-radius:12px;padding:10px 12px;font-size:13px;width:min(100%,560px);text-align:start}
.aicard p{margin:0;font-size:14px}
.aihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aitag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:99px;padding:1px 9px}
.aitag::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor;transform:rotate(45deg)}
.aisug{background:var(--ai-soft);border-radius:8px;padding:6px 9px}
.aisug b{color:var(--ai)}
.aibtn{border:1px solid var(--ai);color:var(--ai);background:var(--ai-soft);border-radius:8px;padding:7px 14px;font-weight:700;font-size:14px}
.aibtn:disabled{opacity:.6;cursor:default}
.tile .aib{position:absolute;top:8px;right:8px;background:var(--ai);color:var(--panel);font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
.tile .aib.hz{background:var(--crit);color:#fff}
.stage{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(min-width:560px){.stage{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}}
.stage-media{border-radius:10px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3}
.stage-media img,.stage-media video{width:100%;height:100%;object-fit:cover;display:block}
.stage-side{display:grid;gap:8px;align-content:start;min-width:0}
.stage-side textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);resize:vertical;min-height:84px}
.stage-side .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.micbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;min-height:44px}
.micbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.micbtn.on{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:no-preference){.micbtn.on svg{animation:micpulse 1s ease-in-out infinite}}
@keyframes micpulse{50%{transform:scale(1.25)}}
.vnote{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:10px 12px;text-align:start;width:min(100%,560px)}
.vnote svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;flex:none;margin-top:2px}
.vnote p{margin:2px 0 0;font-size:14px}
.tile .vmsg{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.tile .vmsg svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.tile .aib.rec{top:auto;bottom:30px;background:var(--ok);color:#fff}
.reccard{display:grid;gap:8px;background:var(--panel);color:var(--ink);border:1px solid var(--ok);border-radius:12px;padding:10px 12px;font-size:13.5px;width:min(100%,560px);text-align:start}
.reccard p{margin:0;font-size:14px}
.reccard ol{margin:0;padding-inline-start:20px;display:grid;gap:5px}
.reccard .ref{display:inline-block;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px;direction:ltr;unicode-bidi:isolate}
.recwarn{background:var(--warn-soft);border-radius:8px;padding:6px 9px;display:grid;gap:3px}
.aitag.rec{background:var(--ok-soft);color:var(--ok)}
.latest{display:grid;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}

/* ================= device mode =================
   One link per device locks the screen to its role: ?d=ops (operations room PC), ?d=ic (incident commander iPad),
   ?d=aic (assistant iPad), ?d=sector (sector commander phone). #d-ops … works too. No device = all four tabs (demo). */
const DEVS={ops:'op',ic:'ic',aic:'lo',sector:'sc'};
const DEV=(()=>{let d='';try{d=new URLSearchParams(location.search).get('d')||''}catch(e){}
 if(!DEVS[d]){const m=(location.hash||'').match(/^#d-(ops|ic|aic|sector)$/);d=m?m[1]:''}return DEVS[d]?d:null})();
if(DEV)document.documentElement.classList.add('dev','dev-'+DEV);

/* ================= state ================= */
const S={
 inc:template(), requests:[], log:[],
 incidents:[], cur:null, store:{}, opsReqs:[],      // every incident; the one this device is following; local-only data
 opForm:null, opErr:'', assignSel:{}, closeAsk:null, osq:1, osNote:'',
 vrText:'', vrBusy:false, vrOut:null, aiBusy:new Set(), recBusy:new Set(), stage:null, listening:null, ai:false, aiImg:false,
 layer:(()=>{try{return localStorage.getItem('icLayer')||'streets'}catch(e){return 'streets'}})(), opQ:'', opType:'', opSort:'new', mapInc:null, mapSt:null, pick:false, mv:{cx:0,cy:0,z:20,auto:true,key:''}, fold:new Set(), sound:false, flashInc:null, incSeen:null,

 media:[], mediaLocal:[], seenMedia:new Set(), newMedia:new Set(), mediaUnseen:0, mediaNote:'', uploading:0, lightbox:null, assetsChecked:false,

};
(function initHash(){
 let h='';try{h=location.hash.slice(1)}catch(e){}

 const m=h.match(/^(op|sc|lo|ic)(?:-([ABCD]))?$/);if(m&&!DEV)S.role=m[1];if(m&&m[2])S.my=m[2];
 try{S.cur=localStorage.getItem('icinc')||null}catch(e){}

/* ================= persistence layer =================
   incidents/{id}            one document per incident (ops fields + the live field state)
   incidents/{id}/requests   resource requests inside the incident
   incidents/{id}/log        event log, incidents/{id}/media  photos and video
   opsreq/{id}               requests for extra stations, handled by the operations room */
let db=null, room=null, assets=null, chain=Promise.resolve(), unsub=[];
const BK=()=>window.icBackend||window.claude;   // own backend (Firebase) when configured, else the claude.ai runtime
function queue(fn){chain=chain.then(fn).catch(e=>{if(e&&(e.code==='invalid_argument'||e.code==='permission-denied'))toast('لا تملك صلاحية التعديل على هذا الحادث');else if(e&&e.code)toast('تعذّر الحفظ، حاول مرة أخرى')});return chain}
const live=()=>S.conn==='live';
const P=(id=S.cur)=>'incidents/'+id;
const curInc=()=>S.incidents.find(i=>i.id===S.cur);
const findInc=id=>S.incidents.find(i=>i.id===id);
function deepMerge(t,p){for(const k in p){const v=p[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))deepMerge(t[k],v);else t[k]=Array.isArray(v)?JSON.parse(JSON.stringify(v)):(v&&typeof v==='object'?JSON.parse(JSON.stringify(v)):v)}return t}
function patchInc(p,id=S.cur){const inc=findInc(id);if(inc)deepMerge(inc,p);if(live())queue(()=>db.doc(P(id)).update(p))}
function putReq(r){const i=S.requests.findIndex(x=>x.id===r.id);if(i<0)S.requests.push(r);else S.requests[i]=r;S.seen.add(r.id);
 if(live()){const {id,...body}=r,base=P();queue(()=>db.collection(base+'/requests').doc(id).set(body))}}
function addLog(text,id=S.cur){const e={id:uid('l'),t:now(),text};
 (id===S.cur?S.log:(S.store[id]||(S.store[id]={requests:[],log:[],media:[]})).log).unshift(e);
 if(live()){const {id:lid,...b}=e;queue(()=>db.collection(P(id)+'/log').doc(lid).set(b))}}
function putOps(r){const i=S.opsReqs.findIndex(x=>x.id===r.id);if(i<0)S.opsReqs.unshift(r);else S.opsReqs[i]=r;
 if(live()){const {id,...b}=r;queue(()=>db.collection('opsreq').doc(id).set(b))}}

/* follow one incident on this device: swap in its requests, log and media */
function selectInc(id){
 S.cur=id||null;try{localStorage.setItem('icinc',S.cur||'')}catch(e){}
 S.inc=curInc()||template();     // placeholder keeps the field views safe when nothing is selected
 S._cnt={};S.compose=null;
 if(!live()){const st=S.store[S.cur]||(S.store[S.cur]={requests:[],log:[],media:[]});S.requests=st.requests;S.log=st.log;S.mediaLocal=st.media;return}
 unsub.forEach(u=>u());unsub=[];S.requests=[];S.log=[];S.media=[];S.booted=false;S.mediaBooted=false;
 if(!S.cur)return;
 const base=P();
 unsub.push(db.collection(base+'/requests').onSnapshot(q=>{
  let fresh=[];
  S.requests=q.docs.map(d=>({id:d.id,...d.data()}));
  for(const r of S.requests){if(!S.seen.has(r.id)){S.seen.add(r.id);if(S.booted&&r.status==='new')fresh.push(r)}}
  S.booted=true;
  if(fresh.length&&(S.role==='lo'||S.role==='ic')){const r=fresh[0];toast(`طلب جديد من القطاع ${L[r.sec]}: ${RES[r.type]} ×${r.qty}`);S.flashReq=r.id}
  schedule();
 },()=>{}));
 unsub.push(db.collection(base+'/log').orderBy('t','desc').limit(80).onSnapshot(q=>{S.log=q.docs.map(d=>({id:d.id,...d.data()}));schedule()},()=>{}));
 unsub.push(db.collection(base+'/media').orderBy('t','desc').limit(60).onSnapshot(q=>{
  const list=q.docs.map(d=>({id:d.id,...d.data()}));
  const fresh=list.filter(m=>!S.seenMedia.has(m.id));list.forEach(m=>S.seenMedia.add(m.id));
  if(S.mediaBooted&&fresh.length){fresh.forEach(m=>S.newMedia.add(m.id));
   if(S.role==='ic'){const m=fresh[0];toast(`${m.kind==='video'?'فيديو جديد':'صورة جديدة'} من القطاع ${L[m.sec]||''}`)}else S.mediaUnseen+=fresh.length}
  S.mediaBooted=true;S.media=list;schedule();
 },()=>{}));
}

async function connect(){
 if(!BK()||!BK().use)return;
 db=await BK().use('db');
 if(!db)return;
 db.collection('incidents').onSnapshot(q=>{
  const first=!live();S.conn='live';
  if(first){S.store={};S.opsReqs=[]}          // drop the offline samples
  S.incidents=q.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})).sort((a,b)=>(b.created||0)-(a.created||0));
  const seen=S.incSeen;S.incSeen=new Set(S.incidents.map(i=>i.id));
  const nw=seen&&S.incidents.find(i=>!seen.has(i.id)&&i.status!=='closed');
  if(nw&&S.role!=='op'){toast(`بلاغ جديد: ${nw.type} في ${nw.name} — مركز ${(nw.stations||[])[0]||''}`);beep()}
  const keep=curInc(),want=keep?S.cur:((S.incidents.find(i=>i.status!=='closed')||{}).id||null);
  if(first||want!==S.cur)selectInc(want);else S.inc=keep||template();
  schedule();
 },()=>{});
 db.collection('opsreq').orderBy('t','desc').limit(100).onSnapshot(q=>{
  const prev=new Set(S.opsReqs.map(r=>r.id));S.opsReqs=q.docs.map(d=>({id:d.id,...d.data()}));
  const f=S.opsBooted&&S.opsReqs.find(r=>!prev.has(r.id)&&r.status==='new');
  if(f&&S.role==='op'){toast(`طلب دعم من ${f.incName}: ${f.qty} مركز إضافي`);beep()}
  S.opsBooted=true;schedule();
 },()=>{});
 BK().use('assets').then(a=>{assets=a;S.assetsChecked=true;schedule()}).catch(()=>{S.assetsChecked=true;schedule()});
 room=await BK().use('room');
 if(room){
  room.onPeers(ch=>{S.peers=ch.peers.filter(p=>p.kind==='viewer');renderPeers()},()=>{});
  sendPresence();
 }
}
window.addEventListener('ic-backend-error',e=>{const c=(e.detail&&e.detail.code)||'';
 toast(c==='permission-denied'?'لا تملك صلاحية الحفظ على الخادم.':/^auth\//.test(c)?'تعذّر تسجيل دخول الجهاز إلى الخادم. تأكد من إعداد Firebase.':'تعذّر الحفظ على الخادم، حاول مرة أخرى.')});
function sendPresence(){if(room)room.presence({role:S.role,sec:S.role==='sc'?S.my:null}).catch(()=>{})}

/* ---- operations room actions ---- */
function createIncident(inc,firstLog){
 const id=uid('i');inc.id=id;S.incidents.unshift(inc);
 if(live()){const {id:_,...body}=inc;queue(()=>db.doc('incidents/'+id).set(body))}
 selectInc(id);addLog(firstLog,id);return inc;
}
function addStation(id,st){
 const inc=findInc(id);if(!inc)return;
 let n=inc.n,k=KEYS.slice(0,n).find(x=>!inc.sectors[x].station);
 if(!k&&n<4){k=KEYS[n];n++}
 const p={stations:[...(inc.stations||[]),st],dispatch:{[st]:now()}};
 if(k){p.sectors={[k]:staffSector(JSON.parse(JSON.stringify(inc.sectors[k])),st)};if(n!==inc.n)p.n=n}
 patchInc(p,id);
 addLog(`غرفة العمليات: تكليف مركز ${st}${k?' — القطاع '+L[k]:' — ينتظر في منطقة تجميع الموارد'}`,id);
 if(k&&id===S.cur)ripple(k);
}
let actx=null;
function beep(){if(!S.sound)return;try{actx=actx||new AudioContext();const t=actx.currentTime;
 for(const [d,fq] of [[0,880],[.18,1175]]){const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=fq;
  g.gain.setValueAtTime(.07,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+.16);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.17)}}catch(e){}}
function closeIncident(id){patchInc({status:'closed',closedAt:now()},id);addLog('غرفة العمليات: إغلاق الحادث وعودة المراكز',id)}
const opsStations=()=>[...new Set([...STATIONS,...S.incidents.flatMap(i=>(i.customStations||[]).map(c=>c.name))])];
function stationOpts(inc,sel){

const SOP_KB=[{"id":"101","title":"الأسلوب التكتيكي (هجومي/دفاعي)","page":"16","keys":["أسلوب تكتيكي","هجومي","دفاعي","offensive","defensive","tactical mode","انهيار","collapse","قطاع","قرار"],"points":["يحدد قائد الحادث الأسلوب التكتيكي بعد التقييم الأولي ويعلنه لجميع الأفراد والقادمين وغرفة العمليات.","هجومي: الفوائد تفوق المخاطر، فتُدخَل الطواقم لمكافحة الحريق بقوة وتنفيذ الإنقاذ وإيقاف الآلات.","دفاعي: المخاطر تفوق الفوائد مهما أضيفت إجراءات تحكم؛ مدافع أرضية وقواذف من المنصات وحماية المجاورات دون دخول منطقة الخطر.","عند أي شك يُعتمد الأسلوب الدفاعي.","لقائد القطاع التحول فوراً من هجومي إلى دفاعي عند علامات الانهيار أو خطر مستجد، ثم إبلاغ قائد الحادث.","لا تحوُّل إلى هجومي داخل قطاع والأسلوب السائد دفاعي إلا بإذن قائد الحادث.","لا تُدخَل الطواقم أبداً دون تقييم ديناميكي للمخاطر، ويُبلَّغ الجميع عند تغيير الأسلوب."]},{"id":"101-c","title":"الأطواق والقطاعات والقيادة","page":"22","keys":["طوق","cordon","قطاع","sector","قيادة","command","تسليم","ضابط سلامة","منطقة ساخنة"],"points":["طوقان على الأقل: داخلي (منطقة خطر عالية) وخارجي تتولاه الشرطة.","دخول الطوق الداخلي بأقل عدد لازم، بعد إيجاز كامل ومهمة محددة، وبمعدات الوقاية المناسبة.","نطاق الإشراف التكتيكي 5 خطوط اتصال مباشرة، و2-3 في الحوادث سريعة التطور، و6-7 في الوضع المستقر.","تُرقَّم القطاعات باتجاه عقارب الساعة من المدخل الرئيسي أو نقطة الهجوم الأولى، ويبقى قائد القطاع في قطاعه.","عند التسليم: إعلان تولي القيادة، ونقل الأهداف والأسلوب التكتيكي والمخاطر والانتشار والموارد."]},{"id":"103","title":"التقييم الديناميكي للمخاطر","page":"45","keys":["تقييم","مخاطر","dra","dynamic risk assessment","risk","سلامة","قرار","إنقاذ"],"points":["نخاطر بقدر محسوب لإنقاذ أرواح يمكن إنقاذها، وبقدر قليل لممتلكات يمكن إنقاذها، ولا نخاطر أبداً بما فُقد.","الخطوات: تقييم الموقف والمهام والمعرضين، إعلان الأسلوب التكتيكي، اختيار نظام عمل آمن، تقييمه، إجراءات إضافية، إعادة التقييم.","إجراءات تحكم إضافية: معدات متخصصة كالمنصة الهيدروليكية، ضباط سلامة، أجهزة التنفس، معدات وقاية خاصة، لافتات.","إذا بقيت المخاطر تفوق الفوائد بعد كل الإجراءات فلا تنفذ المهمة وابحث عن بديل آمن.","في مرحلة الإغلاق تقل مبررات قبول المخاطر؛ أوقف العمل دون تردد حفاظاً على السلامة."]},{"id":"104","title":"الصحة والسلامة في موقع الحادث","page":"56","keys":["سلامة","health","safety","إجهاد","ثبات المبنى","أجهزة التنفس","منصة","near miss"],"points":["لكل الرتب السلطة والواجب لاتخاذ إجراء فوري لصالح السلامة.","فكّر قبل أن تتصرف، ولا تعتمد على المعلومات المسبقة حتى يتأكد صحتها في الموقع.","راقب المخاطر المستجدة كتأثير الحريق على ثبات المبنى، وعلامات الإجهاد على الأفراد.","مع وجود مرتدي أجهزة التنفس بالداخل، يلزم إذن قبل توجيه مدفع المنصة الهوائية إلى داخل المبنى."]},{"id":"105","title":"عمليات المباني المرتفعة","page":"71","keys":["برج","مبنى مرتفع","high rise","tower","طوابق","مصعد","صاعد جاف","bridgehead","سلالم"],"points":["مبنى مرتفع: 8-29 طابقاً؛ فائق الارتفاع: 30 طابقاً فأكثر.","قطاع الحريق: طابق الحريق وطابق فوقه وطابق تحته؛ قطاع البحث فوقه؛ قطاع البهو من الأرضي حتى قطاع الحريق.","رأس الجسر على الأقل طابق واحد أسفل قطاع الحريق.","عند استخدام المصعد: التوجه للطابق أسفل قطاع الحريق مع ارتداء أجهزة التنفس احتياطاً، والتحكم بمفتاح رجال الإطفاء.","لا تستخدم بكرات الخراطيم المدمجة في المبنى، ولا يُشحن الصاعد الجاف إلا بأمر قائد الحادث.","مد خط حماية إضافي من رأس الجسر إلى مدخل ردهة الإطفاء، وتفقد الطوابق فوق الحريق."]},{"id":"108","title":"أسطوانات الأسيتيلين","page":"118","keys":["أسيتيلين","acetylene","أسطوانة","لحام","ورشة","cylinder","أكسجين","انفجار"],"points":["عند الاشتباه بتعرض أسطوانة أسيتيلين للحريق: منطقة خطر أولية حتى 200 م نصف قطر بالتنسيق مع الشرطة.","عند الانفجار: كرة نار حتى 25 م، قذف الأسطوانة حتى 150 م، والشظايا حتى 200 م.","علامات التسخين: ملصقات محترقة، حلقات بلاستيكية ذائبة، طلاء محترق أو متقرح؛ والأسطوانة الفارغة تبقى خطرة.","برّد بالمدافع أو القواذف المثبتة من خلف ساتر؛ إن لم يوجد ساتر ولا خطر على الأرواح فتُترك دون ماء.","لا تحرك الأسطوانة الساخنة؛ تبقى مكانها 24 ساعة على الأقل بعد إزالة مصدر الحرارة.","اختبار الترطيب: بقاء السطح مبللاً يسمح بتقليص منطقة الخطر ثم استئناف التبريد لبقية 24 ساعة.","عمل أداة تخفيف الضغط أو قراءة الكاميرا الحرارية ليست دليلاً على السلامة."]},{"id":"109","title":"حرائق المنشآت والمحطات الكهربائية","page":"129","keys":["محطة كهربائية","محول","substation","كهرباء","ديوا","dewa","electrical","عزل"],"points":["لا إطفاء ولا إنقاذ مطلقاً والمحطة الفرعية لا تزال مكهربة؛ فقط بعد العزل والتشاور مع مهندس مختص.","رسالة عاجلة لغرفة العمليات لإبلاغ شركة الكهرباء والماء بالعزل وتأكيد عدم إعادة التغذية حتى حضور مهندسيها.","إعادة التغذية عن بُعد سببت سابقاً وميضاً وانفجاراً ثانياً أصاب فرق الطوارئ.","معدات وقاية كاملة مع قفازات كهربائية، وأجهزة التنفس دائماً في حالات الحريق.","أقل قدر من المعدات عند الدخول، وتأكد من عدم وجود كوابل علوية مكهربة عند استخدام السلالم.","تمركز الآليات بحيث لا تتورط في الحادث، واطلب خبير الموقع إن لم يكن حاضراً."]},{"id":"110","title":"المخاطر الكهربائية وخطوط الضغط العالي","page":"134","keys":["خطوط ضغط عالي","كهرباء","كابلات","power line","high voltage","electrical","صعق","تيار"],"points":["مسافات الأمان: دون خراطيم الإنقاذ 5 م والسلالم/المنصات 10 م؛ مع الخراطيم القواذف اليدوية 20 م والمدافع 30 م.","مخاطر الخطوط العلوية: القوس الكهربائي، والتوصيل عبر الماء أو الرغوة أو الدخان، والتيار المستحث.","لا تلمس المعدات الكهربائية ولا تقترب منها حتى يتأكد عزلها وسلامتها.","لا إنقاذ لأشخاص على موصلات ضغط عالٍ مكهربة قبل تصريح كامل من مهندس شركة الكهرباء.","أبلغ غرفة العمليات واطلب شركة الكهرباء، ولا يتصرف أحد قبل تأكيد قائد الاستجابة الأولى.","السائق المصاب لا يُحرَّك حتى إزالة الخطر الكهربائي، مع الحفاظ على مسافة الاقتراب الآمنة."]},{"id":"111","title":"الغاز البترولي المسال: الأطواق والتبريد","page":"151","keys":["غاز","أسطوانة","lpg","غاز مسال","بوتان","بروبان","bleve","انفجار","تبريد"],"points":["أرسل رسالة بتورط أسطوانات غاز مسال، وتمركز أعلى المنحدر وعكس اتجاه الريح مع استغلال السواتر.","طوق خارجي 200 م تتولاه الشرطة، ومنطقة خطر لا تقل عن 50 م.","داخل منطقة الخطر: أقل عدد ببدلة كاملة وغطاء الوميض وأجهزة التنفس.","الجدران الفاصلة والأسوار والمركبات بما فيها آليات الإطفاء لا تُعد ساتراً كافياً.","برّد الأسطوانة فوراً وباستمرار بمدافع أو قواذف مثبتة بنمط الرذاذ من موقع آمن لمنع BLEVE.","إذا تعذر التبريد يُخلى الجمهور خارج الطوق الخارجي بالتنسيق مع الشرطة.","يُقلَّص الطوق بعد التبريد واجتياز الكاميرا الحرارية واختبار الترطيب وتأكد عدم التسرب."]},{"id":"111-b","title":"تسرب الغاز المسال المشتعل وغير المشتعل","page":"155","keys":["تسرب غاز","leak","صمام","lpg","غاز","رائحة غاز","أنبوب","سحابة"],"points":["التسرب غير المشتعل: أغلق الصمام، ولا تشعله عمداً، وأزل مصادر الاشتعال وخاصة المنخفضة لأن الغاز أثقل من الهواء.","شتت سحابة الغاز برذاذ مائي من مدافع أرضية أو قواذف مثبتة عبر مسار البخار؛ وبالتهوية في الأماكن المغلقة.","التسرب المشتعل: الأولوية لإيقاف التسرب؛ إطفاء اللهب دون قطع الغاز قد يخلق وضعاً أخطر.","اقترب من الخزانات الثابتة من الجوانب لا من الأطراف.","عند عمل صمام تخفيف الضغط: زد معدل الماء كثيراً، أخلِ المنطقة، ثبّت القواذف واسحب الطواقم.","اختبار الترطيب: تصاعد البخار أو جفاف السطح بسرعة يعني الفشل، فلا تُقلَّص منطقة الخطر."]},{"id":"114","title":"المنتجات البترولية وخزانات التخزين","page":"197","keys":["خزان","وقود","بترول","نفط","tank","oil","boil-over","تبريد","مصفاة"],"points":["الماء يطفئ الزيوت الثقيلة بالرذاذ لا بالنفث، لكنه لا يطفئ البنزين والزيوت الخفيفة.","التبريد بنحو 10.2 لتر/دقيقة/م² والأولوية للأجزاء الملامسة للهب؛ للخزانات المجاورة يُحسب ثلث مساحتها.","لا تبرّد سقف الخزان العائم بالماء، ولا توجه الماء داخل الخزان المشتعل.","برّد الخزانات الواقعة ضمن 45 م باتجاه الريح من الخزان المشتعل.","لا يُبدأ هجوم الرغوة قبل تأمين الماء والمركّز والمعدات، مع تبريد المعرضات في الأثناء.","علامة الغليان الفائض: ارتفاع اللهب وسطوعه لدقائق؛ قد يمتد حتى أربعة أقطار خزان؛ اسحب الأفراد خارج جدار الحوض.","لا تُدخل الطواقم منطقة الحوض في حريق سطحي كامل لخزان نفط خام."]},{"id":"115","title":"الإطفاء بالرغوة","page":"226","keys":["رغوة","foam","آلية الرغاوي","afff","سائل قابل للاشتعال","وقود","كحول","بقعة"],"points":["لا تطبق الرغوة قبل تقدير خطر الأرواح والمادة ونوع الرغوة والكمية اللازمة واحتياطي الرغوة والماء.","اجمع ما لا يقل عن 30 دقيقة من مركّز الرغوة قبل الهجوم في الحوادث الكبيرة.","لا تضرب سطح الوقود مباشرة؛ استخدم الجدار الخلفي أو السقوط الحر أو الارتداد أمام الوقود الجاري.","المذيبات القطبية والكحولات: رغوة مقاومة للكحول AR بمعدل حتى الضعف؛ لا تستخدم الرغوة العادية.","لا تخلط أنواع المركّزات، ولا توجه رشاشات التبريد على الرغوة.","لا تمشِ في المحلول مع بقاء الحرارة؛ قد ينكسر الغطاء ويرتد اللهب.","الرغوة عالية التمدد تُصب ولا تُقذف، مع تهوية الحيز وأجهزة التنفس والبقاء على الخط."]},{"id":"116","title":"حرائق السراديب والطوابق السفلية","page":"235","keys":["سرداب","قبو","basement","طابق سفلي","موقف سفلي","cellar","حرارة","دخان"],"points":["المخاطر: تراكم الحرارة وحاجز حراري على الدرج، تهوية واتصالات محدودة، ودخان كثيف.","لا تعرّض سلامة وخروج فرق أجهزة التنفس الموجودة للخطر عند إدخال فرق جديدة؛ ودوّر الطواقم بانتظام.","قد يلزم تدوير الطواقم بعد عشرين دقيقة بسبب الإجهاد الحراري.","استخدم PPV إذا وُجد منفذ مناسب لخروج الغازات.","لا تخاطر بالأرواح إذا كان النظام الثابت يعمل ولا يوجد خطر على الأرواح بالداخل.","يجب وجود طاقم طوارئ احتياطي دائماً، وتحقق من الانتشار عبر الفتحات والطوابق وعلامات الوميض والارتداد."]},{"id":"117","title":"عمليات المواد الخطرة","page":"242","keys":["مواد خطرة","hazmat","كيماويات","تسرب","تلوث","decontamination","أمونيا","كلور","سام"],"points":["المستوى 1 يمكن السيطرة عليه؛ المستوى 2 خطر كبير ويُبلَّغ مركز دعم الحوادث خلال 30 دقيقة؛ المستوى 3 حادث كبير أو إطلاق متعمد.","يؤكد قائد الحادث المستوى بعد التقييم، ويرسل نموذج HAN1 (الأقسام 1-9) لغرفة العمليات بأسرع وقت.","منطقة إزالة التلوث بعكس الريح من موقع التسرب، في مكان هادئ قرب مصرف، ومؤمَّنة ضد الدخول.","اتخذ خطوات لمنع الضرر البيئي وأشرك البلدية مبكراً.","الأمونيا والكلور: تمركز بعكس الريح، وقاية كاملة وأجهزة تنفس، ولا تضف الماء مباشرة لانسكاب الأمونيا السائلة."]},{"id":"121","title":"مخاطر الغبار","page":"315","keys":["غبار","dust","مطحنة","طحين","دقيق","ألمنيوم","مغنيسيوم","مسحوق","صوامع"],"points":["انفجار تمهيدي صغير يثير الغبار المترسب فيتبعه انفجار مدمر قد يهدم المبنى.","أخطر المواقع مطاحن الدقيق والنشا والفحم وطحن المعادن، وأصعبها مساحيق الألومنيوم والمغنيسيوم والبرونز.","تجنب النفث وحتى الرشاشات التي تضرب أكوام الغبار؛ استخدم رذاذاً ناعماً منخفض السرعة بحذر شديد.","المساحيق المعدنية: طباشير أو جرافيت أو رماد الصودا أو رمل جاف؛ تجنب الماء والرغوة إلا لحماية المجاورات."]},{"id":"122","title":"حرائق المركبات ومخاطرها الانفجارية","page":"320","keys":["سيارة","مركبة","vehicle","car fire","شاحنة","حافلة","حادث مروري","وسادة هوائية","طريق"],"points":["وقاية كاملة ويفضل أجهزة التنفس، وهي إلزامية لحريق مقصورة الركاب؛ الترجل من الجانب البعيد عن المرور.","تمركز الآليات لحماية الموقع من المرور، أعلى المنحدر وعكس الريح، وليس قرب أو خلف مركبات تعمل بالغاز المسال.","حريق المحرك: رذاذ أو رغوة من مسافة آمنة وانتظار الاستجابة؛ سبائك المغنيسيوم تتفاعل بعنف مع الماء.","لا تملأ خزان الوقود بالماء ولا توجه نفثاً على وقود شديد السخونة؛ اعزل البطارية بفصل أطرافها.","اقترب من المركبات المشتعلة من الجوانب، وتجنب المقطورة من الخلف ومحاذاة وسائد التعليق الهوائي.","لا تقطع أو تفكك وسادة هوائية غير منتشرة؛ قد تنشط حتى بعد فصل البطارية.","الحشوات المتفحمة تحوي حمض الهيدروفلوريك: لا تلمسها؛ اغسل الجلد 15 دقيقة على الأقل والعين 30 دقيقة."]},{"id":"153","title":"المركبات الكهربائية والهجينة","page":"682","keys":["سيارة كهربائية","هجينة","ev","electric vehicle","hybrid","بطارية","ليثيوم","انفلات حراري"],"points":["إذا تضررت مركبة كهربائية أو هجينة تُرتدى أجهزة التنفس؛ الانفلات الحراري يحدث فجأة دون إنذار.","عند الحريق: انظر في الاحتراق المتحكم به مع حماية المجاورات ومنع الانتشار.","إن لزم الإطفاء فبكميات كبيرة من الماء لا تقل عن 1125 لتر/دقيقة؛ الماء القليل قد ينتج غازاً ساماً.","تأكد أن المركبة ليست في وضع الجاهزية، وأبعد المفتاح 5 م على الأقل، وافصل الطرف السالب لبطارية 12 فولت.","تفريغ مكونات الجهد العالي قد يستغرق حتى 20 دقيقة؛ تجنب الكابلات البرتقالية ولا تقطع في حزم البطارية.","عند تسرب الإلكتروليت: أجهزة التنفس وقفازات مطاطية كهربائية؛ قفازات الجلد غير كافية."]},{"id":"125","title":"الحرائق السكنية","page":"353","keys":["منزل","فيلا","شقة","سكني","domestic","house","villa","apartment","مطبخ"],"points":["تمركز الآلية دون إعاقة الإنقاذ أو التورط في الحادث، وأعلن الأسلوب التكتيكي بوضوح.","تحقق مبكراً: هل الجميع معروفون، موقع الحريق وحجمه، مخاطر خاصة كأسطوانات الغاز، ومواقع المرافق.","قبل نشر الطواقم: قدّر خطر الوميض والارتداد، وأمّن طريق الدخول والخروج، وخراطيم كافية للتقدم.","في المباني السكنية: فتش جميع الشقق، وحافظ على التواصل مع العالقين عند النوافذ.","أبقِ الدرج المشترك خالياً من الدخان؛ افتح فتحة علوية فيه قبل فتح باب الشقة المحترقة إن سمح الوقت.","توقع انهيار الأسقف والأرضيات والسلالم المحترقة، واعزل الغاز والكهرباء مبكراً."]},{"id":"127","title":"العمل الآمن في الدخان","page":"372","keys":["دخان","smoke","أجهزة التنفس","ba","رؤية","بحث","search","ممر"],"points":["كمية الدخان ليست مؤشراً على حجم الحريق، والدخان قد يشتعل في أي وقت.","أقل عدد من الأفراد، ومسار دخول وخروج واضح، وخط انسحاب مؤمَّن، وإمداد مياه مستمر.","انخفض وتحرك بالانزلاق مستخدماً ظهر اليد، واتبع الخرطوم أو خط الإرشاد.","التهوية بأمر الضابط المسؤول فقط والقواذف في مواقعها، من أعلى نقطة أولاً والفتحة العلوية باتجاه الريح.","افحص مقياس أسطوانة جهاز التنفس عند تغيير الاتجاه أو المستوى وعند طلب قائد الفريق."]},{"id":"128","title":"حرائق المقصورات: الارتداد والوميض","page":"382","keys":["وميض","ارتداد","flashover","backdraft","غرفة","باب","حريق مغلق","compartment"],"points":["علامات الارتداد: دخان كثيف دون لهب ظاهر، نوافذ مسودّة، دخان نابض من الفتحات، وسخونة الباب ومقبضه.","أبقِ الباب مغلقاً ومغطى بقاذف مشحون، وهوِّ من الخارج إن أمكن؛ فتح الباب قرار متعمد.","عند الفتح: انخفض وابقَ بجانب الباب، افتحه قليلاً ورش إلى الأعلى، وابتعد عن البخار والغازات.","علامات الوميض: ارتفاع سريع للحرارة، ألسنة لهب في طبقة الدخان، أسطح تُصدر أبخرة.","لمنع الوميض: نبضات رذاذ على الغازات الساخنة عند السقف مع مراقبة الأثر؛ الإفراط في الماء ينزل طبقة الدخان.","قد يتأخر الارتداد عدة دقائق؛ لا يُعد الحيز آمناً حتى يُفتح للهواء لبعض الوقت."]},{"id":"128-v","title":"التهوية التكتيكية (هجومية/دفاعية)","page":"396","keys":["تهوية","ventilation","ppv","مروحة","فتحة","نوافذ","vent","دخان"],"points":["هجومية: قرب الحريق للحد من انتشاره؛ دفاعية: بعيداً عنه أو بعد إطفائه لحماية طرق الوصول والهروب.","لا تبدأ التهوية الهجومية قبل وجود رجال إطفاء محميين بخطوط مشحونة؛ وهي ليست هجوماً قائماً بذاته.","أبلغ الطواقم في الداخل قبل التهوية وانظر في سحبهم، مع حذر خاص لمن هم في الطوابق فوق الحريق.","عموماً لا تهوية تكتيكية قبل تحديد موقع الحريق.","الفتحة العلوية قبل السفلية وباتجاه الريح وأقرب ما يمكن للحريق؛ لا توجه الماء عبر فتحة خروج الغازات.","أنظمة التكييف قد تغذي الحريق؛ لا تُستخدم إلا كمدخل للهواء.","مراوح PPV: افتح فتحة العادم قبل تشغيل المروحة؛ ولا جدوى من مواجهة رياح قوية."]},{"id":"128-w","title":"المستودعات والمساحات الكبيرة: التهوية وانتشار الحريق","page":"407","keys":["مستودع","warehouse","مخزن","مصنع","factory","صناعي","industrial","مساحة كبيرة","سقف"],"points":["المروحة المنفردة بلا أثر يُذكر في المساحات الكبيرة كالمستودعات؛ أزل الدخان بأسلوب غرفة بغرفة.","في المقصورات الكبيرة قد يصعب تحديد موقع الحريق، فتؤجل عمليات PPV حتى يُحدد.","فتحات السقف المدمجة: افتح الأقرب إلى الحريق؛ كلما بعدت زاد احتمال انتشاره.","إذا كانت الفتحة الوحيدة بعيدة عن الحريق فتوقع انتشاره على المسار إليها.","التهوية الرأسية مناسبة للمباني عديمة النوافذ أو عند وصول الحريق للسقف أو الفراغات المخفية.","انخفاض السقف أو أكوام مواد عالية بعيداً عن الحريق قد تشتعل وتقطع طريق خروج الطواقم."]},{"id":"134","title":"المستشفيات والعيادات","page":"455","keys":["مستشفى","عيادة","hospital","clinic","مرضى","أكسجين","طبي"],"points":["خطر أرواح مرتفع؛ تواصل فوراً مع المسؤول المناوب أو كبير مراقبي الحريق واطلب خطة الطوارئ.","تُستقى المعلومات من خارج الطوق الداخلي، ويفضل في مركبة القيادة المتنقلة.","أنشئ رأس جسر ولا تصعد لطابق الحريق مباشرة قبل وجود حماية بالقواذف وضبط أجهزة التنفس.","نسّق مناطق الفرز مع الإسعاف مع مراعاة المرضى طريحي الفراش وعلى الأكسجين.","التهوية القسرية فقط بتأكيد قائد الحادث، وفعّل إجراءات المواد الخطرة عند تورطها."]},{"id":"147","title":"حرائق محطات الوقود","page":"608","keys":["محطة وقود","بنزين","بترول","ديزل","petrol station","fuel","مضخة","تسرب وقود"],"points":["اطلب مدير المحطة: صمامات ومفاتيح الإيقاف الطارئ، وخطة الطوارئ، وسجل المواد الخطرة ومخطط الموقع.","تسرب بخار أو انسكاب دون اشتعال: أبقِ مصادر الاشتعال على بعد 4 م على الأقل، وانتبه لنقاط التعبئة وأنابيب التهوية.","لا توقف الآليات داخل منطقة الخطر وتوقع وميض البخار؛ الجميع بعكس الريح والشرطة للطوق.","احتوِ الانسكاب بعيداً عن المصارف، وأطفئ الأجهزة الكهربائية وأبقها مطفأة، وقلّل الحركة لتجنب الكهرباء الساكنة.","عند الاشتعال: الرغوة المناسبة بمخزون كافٍ، ولا تكسر غطاءها، ولا تمشِ في الوقود.","احمِ المجاورات بستائر مائية من مدافع أرضية دون تعريض الأفراد."]},{"id":"148","title":"مواقع تخزين الوقود الكبيرة","page":"613","keys":["خزانات","tank farm","مستودع وقود","خزان","tank","مصفاة","refinery","spill","انسكاب"],"points":["سيطر على حريق الانسكاب في الحوض قبل حريق سطح الخزان، وأبقِ الانسكاب مغطى بالرغوة طوال الحادث.","لا تطبق ماءً عادياً على السقف العائم؛ قد يغرق.","انتظر رغوة كافية لهجوم متواصل 55-65 دقيقة على الأقل، و120 دقيقة إذا طال الاشتعال.","إن تعذرت السيطرة: احمِ المعرضات حتى تجتمع الرغوة، واحتفظ بـ50% من كمية الإطفاء بعد الإخماد.","الحقن تحت السطح لا يصلح للإيثانول والمذيبات القطبية، ولا تُشغَّل الأنظمة الثابتة قبل التشاور مع المشغل.","عند تسرب أو انسكاب كبير: وجّه بإيقاف تدفق الخط الوارد، وحدد اتجاه انتقال البخار."]},{"id":"152","title":"منشآت تخزين الأسمدة","page":"662","keys":["سماد","أسمدة","نترات الأمونيوم","ammonium nitrate","fertilizer","مؤكسد","يوريا","مخزن"],"points":["نترات الأمونيوم مؤكسد قوي؛ التسخين أو أي مصدر اشتعال قد يسبب احتراقاً عنيفاً أو انفجاراً.","طوق داخلي 100 م على الأقل، ووقاية كاملة، وأجهزة التنفس في مناطق الدخان.","برّد بسرعة بمدافع أرضية ولا توقف رشاشات التبريد؛ دوّر صهاريج المياه دون انقطاع المصدر.","إذا اشتد الحريق فانظر في الإخلاء لخطر الانفجار، وراقب علامات انهيار الجدران والسقف.","اطلب صحائف بيانات المواد، وعيّن ضابط سلامة وقادة قطاعات، ودوّر الطواقم.","كمامات الجزيئات عند إخماد البقايا، أو أجهزة التنفس داخل المبنى."]}];   // condensed from دليل إجراءات الطوارئ 2017: chapter id, printed page, match keywords, key rules
function kbPick(m){
 const i=S.inc,a=m.ai||{},txt=[i.type,i.name,i.desc,i.notes,i.landmarks,i.hazmat?'مواد خطرة hazmat':'',m.note,a.summary,a.smoke_color,a.fire,...(a.hazards||[])].join(' ').toLowerCase();
 const scored=SOP_KB.map(e=>({e,n:e.keys.filter(k=>k&&txt.includes(String(k).toLowerCase())).length}));
 const core=scored.filter(x=>x.e.id==='101'||x.e.id==='103').map(x=>x.e);
 const rest=scored.filter(x=>x.n>0&&!core.includes(x.e)).sort((a,b)=>b.n-a.n).slice(0,5).map(x=>x.e);
 return [...core,...rest];
}
const REC_PROMPT=(m,kb)=>{const i=S.inc,s=sec(m.sec),a=m.ai;
 return `أنت مستشار لقائد حادث في الدفاع المدني. اقترح أفضل أسلوب للتعامل مع الموقف، معتمدًا فقط على مقتطفات دليل إجراءات الطوارئ (SOP) أدناه وعلى ما يظهر فعلًا.
الحادث: ${i.type||''} في ${i.name||''}. الوصف: ${i.desc||'—'}. ${i.hazmat?'توجد مواد خطرة. ':''}${i.trapped?'محتجزون: '+i.trapped+'. ':''}${i.injured?'مصابون: '+i.injured+'. ':''}${i.notes?'معلومات حرجة: '+i.notes:''}
الأسلوب التكتيكي الحالي: ${MODES[i.mode]||'—'}. القطاع ${L[m.sec]||''} (${SIDE[m.sec]||''}): الوضع ${ST[s.status]?ST[s.status].t:'—'}، أفراد داخل المبنى: ${s.crew.filter(x=>INSIDE.includes(x.pos)).length}.
رسالة قائد القطاع (مفرّغة من الصوت، قد تكون باللهجة الإماراتية): «${m.note||'لا توجد رسالة'}»
${a?`تحليل الصورة: ${a.summary||''}${a.hazards&&a.hazards.length?' — مخاطر ظاهرة: '+a.hazards.join('، '):''}`:''}
مقتطفات دليل الإجراءات:
${kb.map(e=>`[SOP ${e.id.slice(0,3)} · ص ${e.page}] ${e.title}\n- ${e.points.join('\n- ')}`).join('\n\n')}
القواعد: لا تستخدم معلومة أو رقمًا غير موجود في المقتطفات. الأسلوب التكتيكي هجومي أو دفاعي فقط، وعند الشك اختر الدفاعي. كل إجراء يحمل مرجعه بالشكل «SOP 111 · ص 153» من المقتطفات نفسها.
أجب بكائن JSON واحد فقط بالعربية:
{"mode": "هجومي أو دفاعي", "why": "السبب في جملة أو جملتين", "actions": [{"do": "إجراء محدد", "ref": "SOP رقم · ص رقم"}], "warnings": ["تحذير من الدليل يخص هذا الموقف"], "missing": "معلومة يحتاجها القائد للتأكد، أو سلسلة فارغة"}
من 3 إلى 6 إجراءات، مرتبة حسب الأولوية.`};
function cleanRec(o){o=o||{};const mode=['هجومي','دفاعي'].includes(o.mode)?o.mode:'دفاعي';
 const refOk=r=>/SOP\s*\d{3}/.test(r||'')?str(r,40):'';
 return {mode,why:str(o.why,300),actions:(Array.isArray(o.actions)?o.actions:[]).slice(0,6).map(x=>({do:str(x&&x.do,220),ref:refOk(x&&x.ref)})).filter(x=>x.do),
  warnings:(Array.isArray(o.warnings)?o.warnings:[]).map(x=>str(x,200)).filter(Boolean).slice(0,4),missing:str(o.missing,200),t:now()}}
async function recommendMedia(id,fallback,blob){
 const m=allMedia().find(x=>x.id===id)||fallback;if(!m||!sampler||!SOP_KB.length||S.recBusy.has(id))return;
 S.recBusy.add(id);render();
 try{
  const kb=kbPick(m),opt=S.aiImg?{images:[await mediaImage(m,blob)]}:undefined;
  const rec=cleanRec(await sampler.json(REC_PROMPT(m,kb),opt));
  m.rec=rec;const cur=allMedia().find(x=>x.id===id);if(cur)cur.rec=rec;
  if(live())queue(()=>db.collection(P()+'/media').doc(id).update({rec}));
  addLog(`توصية حسب دليل الإجراءات للقطاع ${L[m.sec]||''}: الأسلوب ${rec.mode} — ${rec.why}`);
  if(S.role==='ic')toast(`توصية جديدة للقطاع ${L[m.sec]||''}: الأسلوب ${rec.mode}`);
 }catch(e){toast(AIERR(e&&e.code))}
 finally{S.recBusy.delete(id);render()}

{"log": "صياغة رسمية مختصرة للبلاغ بالعربية الفصحى",

/* speech to text with the browser's own recognition (Arabic, UAE); where it is blocked, the keyboard microphone still works */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let recog=null;

 if(recog){recog.stop();return}
 const sel=target==='vr'?'#vr-text':'#media-note',get=()=>target==='vr'?S.vrText:S.mediaNote,set=v=>{if(target==='vr')S.vrText=v;else S.mediaNote=v;const t=$(sel);if(t)t.value=v};

 recog.lang='ar-AE';recog.interimResults=true;recog.continuous=true;
 const base=(get()||'').trim();let fin='';
 recog.onresult=e=>{let tmp='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+' ';else tmp+=t}set(((base?base+' ':'')+fin+tmp).slice(0,target==='vr'?1500:600))};

async function sendMedia(file,kind){

  const rec={sec:sector,kind,note,t:now()};

/* ================= actions ================= */
function assign(k,type,delta){
 const s=sec(k);
 if(delta>0&&S.inc.pool[type]<1){toast(`لا يوجد ${RES[type]} متاح`);return false}
 if(delta<0&&s.res[type]<1)return false;
 const p={pool:{[type]:S.inc.pool[type]-delta},sectors:{[k]:{res:{[type]:s.res[type]+delta}}}};
 if(type==='ff'){if(delta>0){const a=addCrew(k,1);p.sectors[k].crew=a.crew;p.extra=a.extra}else p.sectors[k].crew=s.crew.slice(0,-1)}
 patchInc(p);
 addLog(`${delta>0?'تخصيص':'سحب'} ${RES[type]} ${delta>0?'إلى':'من'} القطاع ${L[k]}`);
 return true;
}
/* the sector commander confirms receipt; only then does the support count in the sector */
function arrive(r){
 if(r.status!=='route'||S._arriving?.has(r.id))return;(S._arriving=S._arriving||new Set()).add(r.id);
 putReq({...r,status:'done',got:now()});
 const s=sec(r.sec);const p={sectors:{[r.sec]:{res:{[r.type]:s.res[r.type]+r.qty}}}};
 if(r.type==='ff'){const a=addCrew(r.sec,r.qty);p.sectors[r.sec].crew=a.crew;p.extra=a.extra}
 patchInc(p);
 ripple(r.sec);
 addLog(`القطاع ${L[r.sec]} أكد استلام ${RES[r.type]} ×${r.qty}`);
 toast(`تم تأكيد استلام ${RES[r.type]} ×${r.qty}`);
 render();
}

/* ================= 2. logistics ================= */
function LO(){
 const pend=S.requests.filter(r=>r.status==='new').sort((a,b)=>(b.pri==='urgent')-(a.pri==='urgent')||a.t-b.t);
 const route=S.requests.filter(r=>r.status==='route');
 return `
 <div class="cols">
  <div class="stack" style="gap:16px;align-content:start">
   <section class="panel">
    <div class="h2">طلبات القطاعات <span class="count num">${pend.length}</span></div>
    <div class="stack">${pend.length?pend.map(r=>`<div class="req ${r.pri==='urgent'?'urgent':''} ${S.flashReq===r.id?'flash':''} ${fresh('req',r.id)}">
      <span class="letter sm">${L[r.sec]}</span><span><span class="what">${RES[r.type]} × <span class="num">${r.qty}</span></span><br><span class="when">${r.pri==='urgent'?'عاجل · ':''}${clock(r.t)} · ${ago(r.t)} · المتوفر ${S.inc.pool[r.type]}</span></span><span></span>
      <div class="acts"><button class="btn ghost sm" data-act="reject" data-v="${r.id}">رفض</button><button class="btn sm" data-act="approve" data-v="${r.id}">اعتماد وإرسال</button></div></div>`).join(''):'<div class="empty">لا توجد طلبات معلّقة</div>'}
     ${route.map(r=>`<div class="req"><span class="letter sm">${L[r.sec]}</span><span class="what">${RES[r.type]} × <span class="num">${r.qty}</span></span>${reqPill(r)}${trip(r)}</div>`).join('')}
    </div>
   </section>
   <section class="panel"><div class="h2">الموارد المتاحة</div>
    <div class="pool">${REQ.map(t=>`<div class="${S.inc.pool[t]?'drag':'zero'}" ${S.inc.pool[t]?`data-drag="${t}"`:''}><b class="num">${S.inc.pool[t]}</b><span>${RES[t]}</span></div>`).join('')}</div>
    <p class="hint">اسحب أي مورد وأفلته على قطاع في المخطط أو على بطاقة القطاع لتخصيصه.</p>
   </section>
   <section class="panel"><div class="h2">الصورة الحية للموقع</div>${scene(true)}
    <p class="hint">القطاع A هو المدخل الرئيسي أو نقطة المكافحة الأولى، وتُرقّم بقية القطاعات مع اتجاه عقارب الساعة. اضغط على قطاع للانتقال إليه.</p></section>
  </div>
  <div class="stack" style="gap:12px;align-content:start">
   <div class="panel toolbar">
    <span class="muted">عدد القطاعات</span>
    <div class="seg">${[2,3,4].map(n=>`<button data-act="n" data-v="${n}" aria-pressed="${S.inc.n===n}">${n}</button>`).join('')}</div>
    <button class="toggle" data-act="risktoggle" aria-pressed="${S.inc.riskOn}"><i></i>تقييم المخاطر</button>
   </div>
   ${divPanel()}
   ${active().map(k=>{const s=sec(k);return `<article class="sector st-${s.status}" id="sec-${k}" data-drop="${k}">
    <header><span class="letter sm">${L[k]}</span><div class="grow"><h3>القطاع ${L[k]} — ${SIDE[k]} ${divChip(k)}</h3><div class="muted">${esc(s.cmdr)} · ${s.crew.length} فرد</div></div>
     <label><div class="lbl">المركز</div><select data-chg="station" data-k="${k}" id="st-${k}"><option value="">— اختر المركز —</option>${allStations().map(x=>`<option ${x===s.station?'selected':''}>${esc(x)}</option>`).join('')}<option value="__other">أخرى…</option></select></label></header>
    ${S.otherOpen===k?otherForm(k):stInfo(s.station)?`<div class="stinfo"><span>مركز مضاف:</span><span>المشرف <b>${esc(stInfo(s.station).sup)}</b></span><span>الهاتف <b class="ltr">${esc(stInfo(s.station).phone)}</b></span><button class="btn ghost sm" data-act="otheredit" data-k="${k}">تعديل</button></div>`:''}
    <div class="toolbar">
     <div><div class="lbl">تقييم الوضع</div><div class="seg">${Object.keys(ST).map(v=>`<button data-act="status" data-k="${k}" data-v="${v}" aria-pressed="${s.status===v}">${ST[v].t}</button>`).join('')}</div></div>
     ${S.inc.riskOn?`<div><div class="lbl">درجة الخطورة</div><div class="riskdots">${[1,2,3,4,5].map(n=>`<button data-act="risk" data-k="${k}" data-v="${n}" class="${n===s.risk?'on rk'+n:''}" aria-pressed="${n===s.risk}">${n}</button>`).join('')}</div></div>`:''}
    </div>
    <div><div class="lbl">تخصيص الموارد</div><div class="resgrid">${REQ.map(t=>`<div><span>${RES[t]}</span><span class="stepper"><button data-act="adj" data-k="${k}" data-v="${t}:-1" ${s.res[t]?'':'disabled'} aria-label="سحب">−</button><span class="num">${s.res[t]}</span><button data-act="adj" data-k="${k}" data-v="${t}:1" ${S.inc.pool[t]?'':'disabled'} aria-label="تخصيص">+</button></span></div>`).join('')}</div></div>
   </article>`}).join('')}
  </div>
 </div>`;
}

/* ================= 3. incident commander ================= */
function IC(){
 const act=active().map(k=>[k,sec(k)]);
 const pers=act.reduce((a,[,s])=>a+s.crew.length,0);
 const inside=act.reduce((a,[,s])=>a+s.crew.filter(m=>INSIDE.includes(m.pos)).length,0);
 const open=S.requests.filter(r=>r.status==='new');
 const crit=act.filter(([,s])=>s.status==='critical').length;
 const maxRisk=Math.max(...act.map(([,s])=>s.risk));
 const el=Math.floor((now()-S.inc.start)/60000);
 const mine=S.opsReqs.filter(r=>r.inc===S.cur);
 const OSST={new:['بانتظار غرفة العمليات','warn'],done:['أُرسلت المراكز','ok'],rej:['مرفوض','crit']};
 return `
 <div class="kpis">
  <div class="kpi"><b class="num" data-elapsed>${el} د</b><span>منذ البلاغ</span></div>
  <div class="kpi">${cnt('pers',pers)}<span>فرد في الموقع · ${act.length} قطاعات</span></div>
  <div class="kpi">${cnt('inside',inside)}<span>فرد داخل المبنى</span></div>
  <div class="kpi ${open.length?'alert':''}">${cnt('open',open.length)}<span>طلبات دعم معلّقة</span></div>
  <div class="kpi ${crit?'alert':''}">${cnt('crit',crit)}<span>قطاعات بوضع حرج</span></div>
  ${S.inc.riskOn?`<div class="kpi ${maxRisk>=4?'alert':''}">${cnt('risk',maxRisk,'/5')}<span>أعلى درجة خطورة</span></div>`:''}
 </div>
 ${S.inc.mode==='def'&&inside?`<div class="banner" role="alert"><span style="flex:1 1 220px">الأسلوب التكتيكي دفاعي ولا يزال ${inside} فرد داخل المبنى. أصدر أمر الإخلاء.</span><button class="btn sm" data-act="evac">إخلاء كل الأفراد</button></div>`:''}
 <div class="icgrid"><div class="ic-main">
 <div class="panel toolbar"><span class="muted">الأسلوب التكتيكي</span>
  <div class="seg">${Object.entries(MODES).map(([v,t])=>`<button data-act="mode" data-v="${v}" aria-pressed="${S.inc.mode===v}">${t}</button>`).join('')}</div>
  <button class="toggle sim" data-act="sim" aria-pressed="${!!S.simT}"><i></i>محاكاة الأحداث تلقائيًا</button>
  ${evacBtn(S.inc,S.cur)}
 </div>
 <section class="panel"><div class="h2">الصورة الحية للموقع <span class="muted" style="font-weight:400;font-family:var(--f-body)">اضغط على قطاع لعرض تفاصيله</span></div>${scene(false)}</section>
   ${divSummary()}
   <section class="panel"><div class="h2">حالة القطاعات</div><div class="stack">
   ${act.map(([k,s])=>{const pend=pendingFor(k);
    const ins=s.crew.filter(m=>INSIDE.includes(m.pos));
    return `<article class="sector st-${s.status}" id="sec-${k}"><header><span class="letter sm">${L[k]}</span><div class="grow"><h3>${SIDE[k]} ${divChip(k)}</h3><div class="muted">مركز ${esc(s.station||'غير مخصص')}${stExtra(s.station)} · ${esc(s.cmdr)}</div></div>${stPill(s.status)}${S.inc.riskOn?`<span class="pill neutral">خطورة ${s.risk}/5</span>`:''}</header>
     <div class="chips"><span class="chip">الأفراد <b>${s.crew.length}</b></span><span class="chip">داخل المبنى <b>${ins.length}</b></span>
      ${Object.entries(s.res).filter(([t,v])=>v&&t!=='ff').map(([t,v])=>`<span class="chip">${RES[t]} <b>${v}</b></span>`).join('')}
      ${pend?`<span class="pill warn">${pend} طلب معلّق</span>`:''}</div>
     ${s.crew.length?`<details class="crew" data-crew="${k}" ${S.openCrew.has(k)?'open':''}><summary>عرض الطاقم ومواقعهم</summary>
      <div class="mini">${s.crew.map(m=>`<span>${esc(m.name)}</span><span class="muted">${m.pos}</span>`).join('')}</div></details>`:''}
     </article>`}).join('')}
   </div></section>
 </div>
 <aside class="ic-side">
   <section class="panel"><div class="h2">طلبات الدعم</div><div class="stack">
    ${S.requests.length?[...S.requests].sort((a,b)=>b.t-a.t).map(r=>`<div class="req ${r.pri==='urgent'&&r.status==='new'?'urgent':''} ${S.flashReq===r.id?'flash':''} ${fresh('req',r.id)}"><span class="letter sm">${L[r.sec]}</span><span><span class="what">${RES[r.type]} × <span class="num">${r.qty}</span></span><br><span class="when">${r.pri==='urgent'?'عاجل · ':''}${clock(r.t)}</span></span>${reqPill(r)}${r.status==='route'?trip(r):''}</div>`).join(''):'<div class="empty">لا توجد طلبات</div>'}
   </div></section>
 <section class="panel"><div class="h2">طلب مركز إضافي <span class="muted" style="font-weight:400;font-family:var(--f-body)">يصل إلى غرفة العمليات لتكليف مركز آخر</span></div>
  <div class="osreq"><span class="muted">عدد المراكز</span>
   <span class="stepper"><button data-act="osq" data-v="-1" ${S.osq<=1?'disabled':''} aria-label="إنقاص">−</button><span class="num">${S.osq}</span><button data-act="osq" data-v="1" ${S.osq>=3?'disabled':''} aria-label="زيادة">+</button></span>
   <input class="note" id="os-note" data-osnote maxlength="140" placeholder="سبب الطلب، مثل: امتداد الحريق إلى المبنى المجاور" value="${esc(S.osNote||'')}" aria-label="سبب الطلب">
   <button class="btn" data-act="osend">إرسال إلى العمليات</button></div>
  ${mine.length?`<div class="stack" style="margin-top:10px">${mine.map(r=>{const x=OSST[r.status]||OSST.new;return `<div class="req ${fresh('osr',r.id)}"><span class="what">${r.qty} مركز${r.note?' · '+esc(r.note):''}</span><span class="when">${clock(r.t)}</span><span class="pill ${x[1]}">${x[0]}${r.sent&&r.status==='new'?` · أُرسل ${r.sent} من ${r.qty}`:''}</span>${(r.stations||[]).length?`<span class="when" style="grid-column:1/-1">المراكز المرسلة: ${r.stations.map(esc).join('، ')}</span>`:''}</div>`}).join('')}</div>`:''}
 </section>
   <section class="panel"><div class="h2">صور وفيديو من الميدان <span class="count num">${allMedia().length}</span></div>
    ${(()=>{const m=allMedia().find(x=>x.rec||x.note);return m?`<div class="latest"><div class="lbl">آخر رسالة من القطاع ${L[m.sec]||''} · <span class="num">${clock(m.t)}</span> <button class="linkbtn" data-act="media" data-v="${esc(m.id)}">عرض ${m.kind==='video'?'الفيديو':'الصورة'}</button></div>${noteHTML(m)}${recCard(m)}${m.rec?'':recButton(m)}</div>`:''})()}
    ${allMedia().length?`<div class="gallery">${allMedia().map(m=>tile(m,true)).join('')}</div>`:'<div class="empty">لم تصل صور أو فيديوهات بعد. تظهر هنا فور إرسالها من قادة القطاعات.</div>'}</section>
   <section class="panel"><div class="h2">سجل الأحداث</div><ul class="log">${S.log.length?S.log.map(e=>`<li class="${fresh('log',e.id)}"><time>${clock(e.t)}</time><span>${esc(e.text)}</span></li>`).join(''):'<li><time></time><span class="muted">لا توجد أحداث بعد</span></li>'}</ul></section>
 </aside></div>
`;
}

  <label class="wide" for="of-lm">معالم قريبة<input id="of-lm" data-of="landmarks" maxlength="140" value="${v('landmarks')}" placeholder="مثال: خلف محطة الوقود، مقابل دوار الساعة" autocomplete="off"></label>
  <label class="wide" for="of-desc">وصف الحادث<textarea id="of-desc" data-of="desc" rows="3" maxlength="400" placeholder="ماذا يحترق، حجم الدخان، الطوابق المتأثرة">${v('desc')}</textarea></label>

   <label class="wide" for="of-notes">ملاحظات حرجة<input id="of-notes" data-of="notes" maxlength="200" value="${v('notes')}" placeholder="مثال: أسطوانات غاز في المخزن الخلفي، خط كهرباء ضغط عالٍ" autocomplete="off"></label>

  ${S.opsOther&&S.opsOther.ctx==='form'?`<div class="wide">${opsOtherForm()}</div>`:f.custom&&f.custom.name===f.station?`<div class="wide stinfo"><span>مركز آخر:</span><span>المشرف <b>${esc(f.custom.sup)}</b></span><span>الهاتف <b class="ltr">${esc(f.custom.phone)}</b></span></div>`:''}

function opReqHTML(r){const i=findInc(r.inc),sel=S.assignSel['r'+r.id]||'';
 return `<div class="req urgent ${fresh('opr',r.id)}"><span class="letter sm">+</span><span><span class="what">${esc(r.incName||'')} — ${r.qty} مركز إضافي${r.sent?` (أُرسل ${r.sent})`:''}</span><br><span class="when">${esc(r.from||'قائد الحادث')} · ${clock(r.t)} · ${ago(r.t)}${r.note?' · '+esc(r.note):''}</span></span><span></span>
  <div class="acts"><select data-chg="assignsel" data-v="r${r.id}" id="ar-${r.id}" aria-label="المركز"><option value="">— اختر المركز —</option>${stationOpts(i,sel)}<option value="__other">أخرى…</option></select><button class="btn ghost sm" data-act="oprej" data-v="${r.id}">رفض</button><button class="btn sm" data-act="opsend" data-v="${r.id}" ${sel?'':'disabled'}>إرسال المركز</button></div>${S.opsOther&&S.opsOther.ctx==='r'+r.id?opsOtherForm():''}</div>`}

/* divisions: functional groups (for example مكافحة الحريق, البحث والإنقاذ), each led by an officer and covering
   one or more sectors. Stored on the incident as divisions:[{id,name,lead,secs}]. */
const DIVTYPES=['مكافحة الحريق','البحث والإنقاذ','إمداد المياه','الإسعاف والإخلاء','المواد الخطرة','التهوية','الإمداد والتموين'];
const divs=()=>S.inc.divisions||[];
const divOf=k=>divs().find(d=>(d.secs||[]).includes(k));
const divChip=k=>{const d=divOf(k);return d?`<span class="divchip">${esc(d.name)}</span>`:''};
function setDivs(list,log){patchInc({divisions:list});if(log)addLog('مساعد قائد الحادث: '+log)}
function divPanel(){const list=divs();

 for(const x of KEYS.slice(0,i.n))p.sectors[x]={crew:i.sectors[x].crew.map(m=>{if(INSIDE.includes(m.pos)){n++;return {...m,pos:'منطقة تجميع الموارد'}}return m})};

  g.gain.setValueAtTime(.09,t+r*.5+d);g.gain.exponentialRampToValueAtTime(.0001,t+r*.5+d+.2);o.connect(g).connect(actx.destination);o.start(t+r*.5+d);o.stop(t+r*.5+d+.21)}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}}

function renderTicker(){

function animateCounts(){document.querySelectorAll('[data-count]').forEach(el=>{
 const k=el.dataset.count,to=+el.dataset.v,suf=el.dataset.suffix||'',from=S._cnt[k]??0;S._cnt[k]=to;
 if(from===to||RM.matches){el.textContent=to+suf;return}
 const t0=performance.now(),step=t=>{const u=Math.min(1,(t-t0)/700),e=1-Math.pow(1-u,3);el.textContent=Math.round(from+(to-from)*e)+suf;if(u<1&&el.isConnected)requestAnimationFrame(step)};
 requestAnimationFrame(step)})}
function normInc(i){if(!i||!i.pool)return;for(const t of REQ){if(i.pool[t]==null)i.pool[t]=0;for(const k of KEYS)if(i.sectors&&i.sectors[k]&&i.sectors[k].res&&i.sectors[k].res[t]==null)i.sectors[k].res[t]=0}if(!MODES[i.mode])i.mode='def'}

 if(S.role!=='op'&&(!c||c.status==='closed')){$('#view').innerHTML=NOINC();for(const f of Object.values(S._fr))f.boot=true;return}

 S.flashReq=null;S.flashInc=null;mountMap();

 for(const f of Object.values(S._fr))f.boot=true;

/* ---- drag a resource from the pool onto a sector (mouse + touch) ---- */
let drag=null,dragMoved=false;
document.addEventListener('pointerdown',e=>{
 const t=e.target.closest('[data-drag]');if(!t||e.button>0)return;
 drag={type:t.dataset.drag,x:e.clientX,y:e.clientY,ghost:null,over:null};
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(!drag.ghost){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
  drag.st=drag.type.startsWith('st:')?drag.type.slice(3):null;drag.sel=drag.st?'[data-dropinc]':'[data-drop]';
  drag.ghost=document.createElement('div');drag.ghost.className="dragghost";drag.ghost.textContent=drag.st||RES[drag.type];document.body.appendChild(drag.ghost);
  document.querySelectorAll(drag.sel).forEach(d=>d.classList.add('droppable'))}
 e.preventDefault();
 drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
 const tgt=document.elementFromPoint(e.clientX,e.clientY)?.closest(drag.sel)||null;
 if(tgt!==drag.over){drag.over?.classList.remove('dropover');tgt?.classList.add('dropover');drag.over=tgt}
},{passive:false});
function endDrag(e,cancel){
 if(!drag)return;const d=drag;drag=null;
 if(!d.ghost)return;
 dragMoved=true;setTimeout(()=>dragMoved=false,50);
 d.ghost.remove();document.querySelectorAll('.droppable,.dropover').forEach(x=>x.classList.remove('droppable','dropover'));
